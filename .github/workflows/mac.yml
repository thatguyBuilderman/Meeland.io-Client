
name: Meeland Client macOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
              node-version: 22

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/MeelandNew.iconset

          magick "assets/MeelandNew.ico[0]" -resize 16x16 assets/MeelandNew.iconset/icon_16x16.png
          magick "assets/MeelandNew.ico[0]" -resize 32x32 assets/MeelandNew.iconset/icon_16x16@2x.png
          magick "assets/MeelandNew.ico[0]" -resize 32x32 assets/MeelandNew.iconset/icon_32x32.png
          magick "assets/MeelandNew.ico[0]" -resize 64x64 assets/MeelandNew.iconset/icon_32x32@2x.png
          magick "assets/MeelandNew.ico[0]" -resize 128x128 assets/MeelandNew.iconset/icon_128x128.png
          magick "assets/MeelandNew.ico[0]" -resize 256x256 assets/MeelandNew.iconset/icon_128x128@2x.png
          magick "assets/MeelandNew.ico[0]" -resize 256x256 assets/MeelandNew.iconset/icon_256x256.png
          magick "assets/MeelandNew.ico[0]" -resize 512x512 assets/MeelandNew.iconset/icon_256x256@2x.png
          magick "assets/MeelandNew.ico[0]" -resize 512x512 assets/MeelandNew.iconset/icon_512x512.png
          magick "assets/MeelandNew.ico[0]" -resize 1024x1024 assets/MeelandNew.iconset/icon_512x512@2x.png

          iconutil -c icns assets/MeelandNew.iconset -o assets/MeelandNew.icns

      - name: Build Intel Mac installer
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: Build Apple Silicon Mac installer
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Meeland-Client-macOS-Installers
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
